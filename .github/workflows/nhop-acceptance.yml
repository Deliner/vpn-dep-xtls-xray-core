name: N-hop native Fleet acceptance

on:
  push:
    branches: [nhop-acceptance]

permissions:
  contents: read

jobs:
  fleet:
    name: Fleet lifecycle ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned tools
        working-directory: acceptance
        run: bash ops/environment/bootstrap.sh
      - name: Install native Fleet prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 curl ca-certificates jq
      - name: Verify real Fleet lifecycle and controller capacity
        working-directory: acceptance
        run: build/tools/bin/just acceptance-fleet-run '${{ matrix.arch }}'
      - name: Retain Fleet evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fleet-linux-${{ matrix.arch }}
          path: acceptance/build/fleet-acceptance
          if-no-files-found: error
          retention-days: 30
