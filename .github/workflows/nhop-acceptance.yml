name: N-hop Cronet build

on:
  push:
    branches: [nhop-acceptance]

permissions:
  contents: read

jobs:
  cronet:
    name: Cronet Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned tools
        working-directory: acceptance
        run: bash ops/environment/bootstrap.sh
      - name: Build pinned native library and retain linkage evidence
        working-directory: acceptance
        run: build/tools/bin/just acceptance-cronet-run '${{ matrix.arch }}'
      - name: Retain build output even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cronet-linux-${{ matrix.arch }}
          path: acceptance/build/acceptance-results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  native-range:
    name: Native Cronet and Naive acceptance ${{ matrix.arch }}
    needs: cronet
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned tools
        working-directory: acceptance
        run: bash ops/environment/bootstrap.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cronet-linux-${{ matrix.arch }}
          path: acceptance/build/cronet-artifact
      - name: Verify range regression and Naive H2/H3 on actual target CPU
        working-directory: acceptance
        run: build/tools/bin/just acceptance-cronet-verify '${{ matrix.arch }}' build/cronet-artifact
      - name: Preserve native verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cronet-native-${{ matrix.arch }}
          path: acceptance/build/cronet-native-verification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
