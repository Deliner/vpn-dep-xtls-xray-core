name: N-hop MASQUE congestion comparison

on:
  push:
    branches: [nhop-acceptance]

permissions:
  contents: read

jobs:
  masque:
    name: MASQUE Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned tools
        working-directory: acceptance
        run: bash ops/environment/bootstrap.sh
      - name: Install namespace and packet capture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 tcpdump
      - name: Compare ordinary Xray BBR and Reno under identical network faults
        working-directory: acceptance
        run: build/tools/bin/just acceptance-masque-run '${{ matrix.arch }}'
      - name: Retain complete experiments even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: masque-linux-${{ matrix.arch }}
          path: acceptance/build/masque-acceptance
          if-no-files-found: error
          retention-days: 30
