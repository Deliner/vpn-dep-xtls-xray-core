name: N-hop native acceptance

on:
  push:
    branches: [nhop-acceptance]

permissions:
  contents: read

jobs:
  protocols:
    name: Native Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned tools
        working-directory: acceptance
        run: bash ops/environment/bootstrap.sh
      - name: Build, audit and execute the complete native matrix
        working-directory: acceptance
        run: build/tools/bin/just acceptance-run '${{ matrix.arch }}'
      - name: Retain complete results even when acceptance fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acceptance-linux-${{ matrix.arch }}
          path: acceptance/build/acceptance-results
          if-no-files-found: error
          retention-days: 30
      - name: Retain built candidates for reviewed release packaging
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-linux-${{ matrix.arch }}
          path: acceptance/build/runtime-candidates
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
