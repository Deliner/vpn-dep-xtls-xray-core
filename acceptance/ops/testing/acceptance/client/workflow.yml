name: N-hop Linux client acceptance

on:
  push:
    branches: [nhop-acceptance]

permissions:
  contents: read

jobs:
  client:
    name: Linux client ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned tools
        working-directory: acceptance
        run: bash ops/environment/bootstrap.sh
      - name: Install Linux namespace and DNS test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 dbus systemd-resolved ca-certificates jq
      - name: Verify boot registration, all-protocol TUN and client recovery with race instrumentation
        working-directory: acceptance
        run: build/tools/bin/just acceptance-client-run '${{ matrix.arch }}'
      - name: Retain client evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-linux-${{ matrix.arch }}
          path: acceptance/build/client-acceptance
          if-no-files-found: error
          retention-days: 30
