      shadowtls-v3:
        protocol: shadowtls-v3
        port: 24453
        server_name: www.example.org
        target: www.example.org:443
      snell-v5:
        protocol: snell-v5
        port: 24454
      snell-v6:
        protocol: snell-v6
        port: 24455
      trojan:
        protocol: trojan
        port: 24456
        server_name: relay.vpn.example
      trojan-ws:
