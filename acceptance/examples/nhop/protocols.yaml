# All available profiles on each VM. Example IPs; replace before deployment.
# Private TLS certificates are generated unless tls certificate/key files are supplied.
version: 1
name: protocol-fleet
nodes:
  entry:
    address: 192.0.2.10
    bridge_port_start: 40000
    firewall: preserve
    ssh:
      user: root
      port: 22222
      closed_ports: [22]
      identity_file: ~/.ssh-custom/vpn-fleet
      known_hosts_file: ~/.ssh-custom/known_hosts
    services:
      anytls:
        protocol: anytls
        port: 24443
        server_name: entry.vpn.example
      hysteria2:
        protocol: hysteria2
        port: 24444
        server_name: entry.vpn.example
      hysteria2-gecko:
        protocol: hysteria2-gecko
        port: 24445
        server_name: entry.vpn.example
      hysteria2-salamander:
        protocol: hysteria2-salamander
        port: 24446
        server_name: entry.vpn.example
      masque-h2:
        protocol: masque-h2
        port: 24447
        server_name: entry.vpn.example
      masque-h3:
        protocol: masque-h3
        port: 24448
        server_name: entry.vpn.example
      naive-h2:
        protocol: naive-h2
        port: 24449
        server_name: entry.vpn.example
      naive-h3:
        protocol: naive-h3
        port: 24450
        server_name: entry.vpn.example
      shadowsocks:
        protocol: shadowsocks
        port: 24451
      shadowsocks-2022:
        protocol: shadowsocks-2022
        port: 24452
      shadowtls-v3:
        protocol: shadowtls-v3
        port: 24453
        server_name: www.example.org
        target: www.example.org:443
      snell-v5:
        protocol: snell-v5
        port: 24454
      snell-v6:
        protocol: snell-v6
        port: 24455
      trojan:
        protocol: trojan
        port: 24456
        server_name: entry.vpn.example
      trojan-ws:
        protocol: trojan-ws
        port: 24457
        server_name: entry.vpn.example
        path: /vpn
      tuic:
        protocol: tuic
        port: 24458
        server_name: entry.vpn.example
      vless-encryption:
        protocol: vless-encryption
        port: 24459
      vless-reality:
        protocol: vless-reality
        port: 24460
        server_name: www.example.org
        target: www.example.org:443
      vless-tls:
        protocol: vless-tls
        port: 24461
        server_name: entry.vpn.example
      vless-ws:
        protocol: vless-ws
        port: 24462
        server_name: entry.vpn.example
        path: /vpn
      vless-xhttp:
        protocol: vless-xhttp
        port: 24463
        server_name: entry.vpn.example
        path: /vpn
      vmess-tls:
        protocol: vmess-tls
        port: 24464
        server_name: entry.vpn.example
      vmess-ws:
        protocol: vmess-ws
        port: 24465
        server_name: entry.vpn.example
        path: /vpn
  relay:
    address: 192.0.2.20
    bridge_port_start: 40000
    firewall: preserve
    ssh:
      user: root
      port: 22222
      closed_ports: [22]
      identity_file: ~/.ssh-custom/vpn-fleet
